# Sync upstream (earendil-works/pi) changes into master daily.
#
# This fork's value-add over upstream is the Dart port under pi_agent/. The fork
# does not modify the TypeScript packages, so a sync from upstream is expected to
# merge cleanly — there are no fork-owned TS edits to conflict with upstream.
#
# The contract (see AGENTS.md "Fork Upstream Sync Policy"):
#
#   1. Every daily sync merges upstream/main into master. On a clean merge the
#      sync pushes master and opens a deduped `dart-port` issue per affected
#      package area (all 12: schema, telemetry, chord, ai, agent, durable,
#      codemode, env, mcp, coding-agent, tui, evals, plus the apps/ bucket),
#      listing every changed source, test, export, asset, migration, and manifest
#      file with its class label and the new target_upstream_sha. The issue is
#      the hand-off: TS lands here automatically; the Dart port of those changes
#      is the tracked follow-up.
#   2. On any merge conflict, abort, open a `sync`-labeled issue listing the
#      conflicted files, and FAIL the job. Never auto-resolve in favor of
#      upstream — a conflict means the fork touched a file upstream also changed,
#      and a human must reconcile it on a `sync/fork-sync-resolution` branch.
#   3. If nothing changed upstream, the run is a no-op (no issue, no push).
#
# Issues are filed by github-actions[bot], which .github/workflows/issue-gate.yml
# skips, so they are never auto-closed. Setting a SYNC_PAT secret makes the
# checkout/push run as the maintainer and lets the push trigger downstream CI;
# without it the default GITHUB_TOKEN is used (same-repo push still works).

name: Sync Upstream

on:
  schedule:
    # Daily at 04:23 UTC — after the 03:00 fleet syncs (herdr, kimi-code-sync).
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream to master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/earendil-works/pi.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Switch to master
        run: git checkout master || git checkout -b master origin/master

      - name: Check if already up to date
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/main ($UPSTREAM)."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
            echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
            echo "behind by: $(git rev-list --count HEAD..upstream/main) commit(s)"
          fi

      - name: Merge upstream changes (no auto-resolve)
        id: merge
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          set +e
          git merge upstream/main --no-edit \
            -m "chore: sync upstream $(date +%Y-%m-%d)"
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "merge_state=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_state=conflicts" >> "$GITHUB_OUTPUT"
            CONFLICTS=$(git diff --name-only --diff-filter=U | sort)
            echo "conflicts<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICTS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute upstream changes to port
        id: diff
        if: steps.merge.outputs.merge_state == 'clean'
        run: |
          OLD="${{ steps.check.outputs.local }}"
          # Every changed file under packages/** and apps/**, grouped by all 12
          # package areas (schema, telemetry, chord, ai, agent, durable, codemode,
          # env, mcp, coding-agent, tui, evals) — not just agent and ai. Each
          # file is classified as source, test, export, asset, migration, or
          # manifest so the porting issue can list what actually changed.
          CHANGED=$(git diff --name-only "$OLD" HEAD -- 'packages/**' 'apps/**' || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "changed_count=$(printf '%s' "$CHANGED" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          git log --no-merges --pretty='- %s (%h)' "$OLD..HEAD" > /tmp/pi-sync-commits.txt || true
          echo "commit_subjects<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/pi-sync-commits.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Open Dart port issues
        if: steps.merge.outputs.merge_state == 'clean'
        uses: actions/github-script@v7
        with:
          script: |
            const changed = `${{ steps.diff.outputs.changed }}`.trim().split('\n').filter(Boolean);
            const commits = `${{ steps.diff.outputs.commit_subjects }}`.trim().split('\n').filter(Boolean);
            const local = '${{ steps.check.outputs.local }}';
            const upstream = '${{ steps.check.outputs.upstream }}';
            const date = new Date().toISOString().split('T')[0];

            if (changed.length === 0) {
              core.info('No upstream package changes to port.');
              return;
            }

            // The 12 upstream package areas the ledger inventories, in order.
            const AREAS = ['schema', 'telemetry', 'chord', 'ai', 'agent', 'durable',
              'codemode', 'env', 'mcp', 'coding-agent', 'tui', 'evals'];

            // Classify a changed file into an area and a file class.
            function classify(file) {
              const areaMatch = /^packages\/([^/]+)\//.exec(file);
              const area = areaMatch ? areaMatch[1] : (file.startsWith('apps/') ? 'apps' : null);
              if (!area) return null;
              let kind = 'source';
              if (/\.(test|spec)\.(ts|tsx|mts|js|mjs)$/.test(file) || /(^|\/)test\//.test(file)) kind = 'test';
              else if (/(^|\/)spec\//.test(file) || /\.spec\.md$/.test(file)) kind = 'spec';
              else if (/(^|\/)examples?\//.test(file)) kind = 'example';
              else if (/package\.json$/.test(file)) kind = 'manifest';
              else if (/(^|\/)migrations?\//.test(file)) kind = 'migration';
              else if (/(^|\/)(index|api|exports?)\.(ts|tsx)$/.test(file)) kind = 'export';
              return { area, kind, file };
            }

            // Group by area; areas without changes are not reported.
            const groups = new Map();
            for (const file of changed) {
              const entry = classify(file);
              if (!entry) continue;
              if (!groups.has(entry.area)) groups.set(entry.area, []);
              groups.get(entry.area).push(entry);
            }

            // Deterministic per-area porting issue. The issue body lists the
            // file groups with their class labels, the commit range, the new
            // target_upstream_sha, and the command to regenerate the ledger.
            const reportAreas = AREAS.filter((area) => groups.has(area));
            const created = [];
            for (const area of reportAreas) {
              const files = groups.get(area).sort((a, b) => a.file.localeCompare(b.file));
              const byKind = new Map();
              for (const entry of files) {
                if (!byKind.has(entry.kind)) byKind.set(entry.kind, []);
                byKind.get(entry.kind).push(entry.file);
              }
              const section = (kind, list) =>
                list.length ? ['### ' + kind, '', ...list.map((f) => '- `' + f + '`'), ''].join('\n') : '';
              const body = [
                'The daily upstream sync merged **' + commits.length + '** upstream commit(s) into `master`.',
                'This fork does not modify the TypeScript packages, so the merge was clean — but the',
                '**Dart port under `pi_agent/` must be updated to match these upstream changes.**',
                '',
                'The sync already landed the TypeScript in `master`; this issue tracks porting the',
                'behavioral changes for the **' + area + '** area into the Dart agent under `pi_agent/`.',
                '',
                section('source', byKind.get('source') ?? []),
                section('export', byKind.get('export') ?? []),
                section('test', byKind.get('test') ?? []),
                section('spec', byKind.get('spec') ?? []),
                section('example', byKind.get('example') ?? []),
                section('manifest', byKind.get('manifest') ?? []),
                section('migration', byKind.get('migration') ?? []),
                '## Upstream commits in this sync',
                '',
                commits.length ? commits.join('\n') : '_none_',
                '',
                '## Commit refs',
                '',
                '- pre-sync master: `' + local + '`',
                '- upstream/main: `' + upstream + '`',
                '- target_upstream_sha: `' + upstream + '`',
                '',
                '## How to port',
                '',
                '1. `git switch -c dart/port-sync-' + date + ' master`',
                '2. Port each behavioral change for `' + area + '` into `pi_agent/lib/src/`.',
                '3. Regenerate the coverage ledger for the new target SHA:',
                '   `node scripts/coverage/generate-coverage-manifest.mjs --upstream . --sha ' + upstream + ' --out coverage/upstream/' + upstream + '`',
                '   then `node scripts/coverage/check-coverage.mjs --manifest coverage/upstream/' + upstream + '/manifest.json`.',
                '4. Move the area\'s rows to `verified` in the registry with passing evidence, and re-run `check-coverage.mjs`.',
                '5. Run `dart analyze` and `dart test -j 2` in `pi_agent/` until green.',
                '6. Open a PR referencing this issue.',
                '',
                'cc: the arrrrny fork maintainer.',
              ].filter(Boolean).join('\n');

              // Dedup: keep one open dart-port issue per area, comment new syncs onto it.
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'dart-port', per_page: 20,
              });
              const titlePrefix = 'Port upstream ' + area + ' changes into pi_agent (Dart)';
              const existing = issues.data.find((i) => i.title.startsWith(titlePrefix));
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Sync ' + date + ' — ' + commits.length + ' new commit(s), '
                    + files.length + ' file(s) in `' + area + '`.\n\n' + body,
                });
                core.info('Commented on existing ' + area + ' port issue #' + existing.number);
                created.push(existing.number);
              } else {
                const result = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: titlePrefix + ' — ' + date,
                  labels: ['sync', 'dart-port'],
                  body,
                });
                core.info('Opened ' + area + ' port issue #' + result.data.number);
                created.push(result.data.number);
              }
            }

            // The apps/ bucket: any changed file under apps/** is reported as
            // its own dart-port issue so an application-shaped change is never
            // silently dropped from the parity story.
            if (groups.has('apps')) {
              const files = groups.get('apps').sort((a, b) => a.file.localeCompare(b.file));
              const body = [
                'The daily upstream sync merged **' + commits.length + '** upstream commit(s) into `master`.',
                'This fork does not modify the TypeScript packages, so the merge was clean.',
                '',
                'The sync touched upstream `apps/**`. Each upstream app carries an explicit',
                'port/adapt/not_applicable decision in `coverage/upstream/<sha>/app-decisions.json`;',
                'a changed app may need its decision revisited.',
                '',
                '### Changed files',
                '',
                ...files.map((f) => '- `' + f.file + '`'),
                '',
                '- pre-sync master: `' + local + '`',
                '- upstream/main: `' + upstream + '`',
              ].join('\n');
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'dart-port', per_page: 20,
              });
              const existing = issues.data.find((i) => i.title.startsWith('Port upstream apps changes'));
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Sync ' + date + '.\n\n' + body,
                });
                created.push(existing.number);
              } else {
                const result = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: 'Port upstream apps changes into pi_agent (Dart) — ' + date,
                  labels: ['sync', 'dart-port'],
                  body,
                });
                created.push(result.data.number);
              }
            }

            core.info('Dart port issues: ' + (created.join(', ') || 'none'));

      - name: Open sync-conflict issue
        id: conflict_issue
        if: steps.merge.outputs.merge_state == 'conflicts'
        uses: actions/github-script@v7
        with:
          script: |
            const conflicts = `${{ steps.merge.outputs.conflicts }}`.trim().split('\n').filter(Boolean);
            const local = '${{ steps.check.outputs.local }}';
            const upstream = '${{ steps.check.outputs.upstream }}';
            const date = new Date().toISOString().split('T')[0];
            const body = [
              'The daily upstream sync hit **' + conflicts.length + '** merge conflict(s) and aborted.',
              'This fork does not modify TypeScript, so a conflict means a shared file',
              '(e.g. `AGENTS.md`, `README.md`, `.pi/`) was changed on both sides.',
              '',
              '## Conflicted files',
              '',
              ...conflicts.map((f) => '- `' + f + '`'),
              '',
              '## Resolution',
              '',
              '1. `git switch -c sync/fork-sync-resolution master`',
              '2. `git merge upstream/main`',
              '3. Resolve each conflict, keeping the fork additions (fleet AGENTS.md blocks,',
              '   README Zuraffa promo, pi_agent/, specs/, .specify/) and taking upstream TS as-is.',
              '4. Open a PR referencing this issue; the next sync becomes a no-op.',
              '',
              '- pre-sync master: `' + local + '`',
              '- upstream/main: `' + upstream + '`',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync', per_page: 5,
            });
            const existing = issues.data.find((i) => i.title.includes('merge conflicts'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: '🔄 New sync conflict on ' + date + '.\n\n' + body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'sync: upstream merge conflicts require manual resolution',
                labels: ['sync'], body,
              });
            }

      - name: Fail job on conflict
        if: steps.merge.outputs.merge_state == 'conflicts'
        run: |
          echo "::error::merge conflicts detected; sync aborted. See the sync-labeled issue."
          exit 1

      - name: Advance target_upstream_sha
        if: steps.merge.outputs.merge_state == 'clean'
        run: |
          set -e
          UPSTREAM="${{ steps.check.outputs.upstream }}"
          node -e '
            const fs = require("fs");
            const p = "coverage/state.json";
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            s.target_upstream_sha = process.argv[1];
            s.target_advanced_at = new Date().toISOString().split("T")[0];
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + "\n");
          ' "$UPSTREAM"
          git add coverage/state.json
          git diff --cached --quiet || git commit -m "chore: advance target_upstream_sha to ${UPSTREAM}"

      - name: Push
        if: steps.merge.outputs.merge_state == 'clean'
        run: git push origin master

      - name: Open failure issue (catch-all)
        if: failure() && steps.conflict_issue.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The daily upstream sync failed unexpectedly (not a merge conflict — that path files its own issue).',
              '',
              '## Run', '', runUrl, '',
              '## What to check', '',
              '1. Open the run log above and find the failing step.',
              '2. If it is a **push rejection**, the token needs `workflows` permission — set a `SYNC_PAT` secret.',
              '3. Otherwise resolve manually.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync', per_page: 10,
            });
            const existing = issues.data.find((i) =>
              i.title.includes('failed') && !i.title.includes('conflicts'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: '🔄 Another sync failure on ' + new Date().toISOString().split('T')[0] + '.\n\n' + body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'sync: upstream sync failed (' + new Date().toISOString().split('T')[0] + ')',
                labels: ['sync'], body,
              });
            }